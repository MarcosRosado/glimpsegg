<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="50%" stop-color="#070c16" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gem Facet Gradients -->
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="gemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gemBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="gemCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="70%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Subtle Tactical Grid / Crosshair rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Radial Vision Beams / Horizontal Sightlines -->
  <line x1="64" y1="256" x2="116" y2="256" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round" />
  <line x1="396" y1="256" x2="448" y2="256" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round" />
  <line x1="256" y1="64" x2="256" y2="116" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="448" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Ambient Glow Behind Gem -->
  <circle cx="256" cy="256" r="90" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- Eye of True Sight Outer Aperture / Orbit (Modern Clean Minimalist) -->
  <g filter="url(#glow)">
    <path d="M 120 256 C 165 175 347 175 392 256 C 347 337 165 337 120 256 Z" 
          fill="none" 
          stroke="#22d3ee" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Gem / Iris Center Facets -->
  <!-- Top Facet -->
  <polygon points="256,165 315,225 256,256 197,225" fill="url(#gemTop)" opacity="0.95" />
  <!-- Left Facet -->
  <polygon points="197,225 256,256 256,315 170,256" fill="url(#gemLeft)" opacity="0.9" />
  <!-- Right Facet -->
  <polygon points="315,225 342,256 256,315 256,256" fill="url(#gemRight)" opacity="0.9" />
  <!-- Bottom Point -->
  <polygon points="170,256 256,315 256,347 256,315" fill="url(#gemBottom)" opacity="0.8" />

  <!-- Core Eye Pupil / Crystal Core (Octagon / Diamond with Pure Radiant Focus) -->
  <polygon points="256,206 292,220 306,256 292,292 256,306 220,292 206,256 220,220" 
           fill="url(#gemCore)" 
           stroke="#e0f2fe" 
           stroke-width="3" 
           filter="url(#coreGlow)" />

  <!-- Inner Radiant Spark -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <circle cx="251" cy="251" r="5" fill="#ffffff" opacity="0.9" />

  <!-- Corner Tactical Brackets -->
  <path d="M 56 96 L 56 56 L 96 56" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 456 96 L 456 56 L 416 56" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 56 416 L 56 456 L 96 456" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 456 416 L 456 456 L 416 456" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.4" />
</svg>