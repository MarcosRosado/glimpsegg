name: Build & Release GlimpseGG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serializa as releases: dois pushes em sequência não podem disputar a mesma tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Compute, commit and tag next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            # Primeira release do repo: usa a versão do package.json como está.
            next="$(node -p "require('./package.json').version")"
            echo "Nenhuma tag encontrada; primeira release em v$next"
          else
            base="${latest#v}"
            IFS='.' read -r major minor patch <<< "$base"
            next="${major}.${minor}.$((patch + 1))"
            echo "Última tag $latest; próxima versão v$next"
          fi

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::A tag v$next já existe. Abortando para não sobrescrever uma release." >&2
            exit 1
          fi

          npm version "$next" --no-git-tag-version --allow-same-version

          git config user.name  "Marcos Rosado"
          git config user.email "37305197+MarcosRosado@users.noreply.github.com"

          # [skip ci] evita re-disparo; na prática um push feito com o GITHUB_TOKEN
          # padrão já não dispara novos workflow runs — é a segunda barreira.
          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json já está em $next; apenas criando a tag"
          else
            git add package.json package-lock.json
            git commit -m "chore: release v$next [skip ci]"
            git push origin HEAD:main
          fi

          git tag "v$next"
          git push origin "v$next"

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next"    >> "$GITHUB_OUTPUT"

      # A release nasce AQUI, uma vez so, e nao nos tres jobs de plataforma.
      #
      # O publisher do electron-builder faz "procura ou cria" a release da tag. Com os
      # tres jobs da matriz rodando `--publish always` em paralelo, nenhum encontrava a
      # release ainda inexistente e dois deles criavam objetos DIFERENTES para a mesma
      # tag. Aconteceu na v1.0.14: o AppImage e o `latest-linux.yml` foram parar numa
      # release e os artefatos de mac/Windows na outra, entao a release que aparece como
      # `latest` ficou sem o manifesto que o auto-updater do Linux le. Os jobs ja
      # dependem deste (`needs: version`), entao criar a release aqui garante que os tres
      # ENCONTREM a mesma e apenas subam artefatos nela.
      #
      # Nome sem corpo para nao divergir do que o electron-builder criava antes.
      - name: Create the GitHub release (single owner of the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"

          # Idempotente de proposito: um `workflow_dispatch` reexecutado sobre uma tag
          # que ja tem release nao pode falhar aqui.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag ja existe; os jobs de plataforma vao subir os artefatos nela."
          else
            gh release create "$tag" --title "${{ steps.bump.outputs.version }}" --notes ""
          fi

  release:
    name: Build & Release (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Checa out a tag recém-criada: sem isso o electron-builder empacotaria a
      # versão antiga do package.json e os assets colidiriam com a release anterior.
      - name: Checkout Release Tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Project Dependencies
        run: npm ci

      # O CI não gera ícones: o que está commitado é o que a release publica.
      # Este check compara os binários com o sha256 dos masters no manifesto, então
      # "editei o SVG e esqueci de regenerar" falha aqui em vez de sair publicado.
      - name: Verify Icons Are In Sync
        run: npm run icons:check

      # Gate de testes antes do build. Todo push na main dispara release completo, e o
      # unico gate anterior era icones + compilacao — nada verificava a logica de
      # parsing de ward, alinhamento de series ou as regras de coaching. Um erro de
      # sinal ali sai publicado sem ninguem perceber, entao um teste vermelho tem de
      # bloquear o release de proposito.
      - name: Run Unit Tests
        run: npm test

      - name: Compile Frontend Bundle
        run: npm run build

      - name: Package & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          case "${{ runner.os }}" in
            Linux)   builder_args="--linux AppImage" ;;
            Windows) builder_args="--win" ;;
            macOS)   builder_args="--mac" ;;
            *) echo "::error::runner.os inesperado: ${{ runner.os }}" >&2; exit 1 ;;
          esac

          # A release ja existe: o job `version` a criou. Aqui o electron-builder so
          # ENCONTRA a release da tag e sobe os artefatos deste target — nunca cria.
          #
          # Retry porque o upload de assets grandes (.exe/.dmg) já estourou o
          # timeout do httpExecutor do electron-builder. Com nome de artefato
          # único por target e a release ja criada, repetir é seguro.
          for attempt in 1 2 3; do
            echo "::group::electron-builder (tentativa $attempt/3)"
            if npx electron-builder $builder_args --publish always; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Falhou na tentativa $attempt/3"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done

          echo "::error::electron-builder falhou nas 3 tentativas" >&2
          exit 1
