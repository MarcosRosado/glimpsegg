<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    
    <!-- Neon Kinetic Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Cosmic Violet Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.15" />

  <!-- Tactical Reticle / Corner Markers -->
  <path d="M 90 140 L 90 90 L 140 90" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 422 140 L 422 90 L 372 90" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 90 372 L 90 422 L 140 422" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <path d="M 422 372 L 422 422 L 372 422" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Temporal Vortex Loop: Dynamic "G" -->
  <g filter="url(#superGlow)">
    <!-- Outer Kinetic Arc -->
    <path d="M 256 76 A 180 180 0 1 0 436 256 L 436 220" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Rewind Arrow Head at Top Right -->
    <polygon points="405,170 455,225 390,240" fill="#00f0ff" />
    
    <!-- Inward Horizontal G-Bar -->
    <path d="M 436 256 L 276 256" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />
  </g>

  <!-- Inner Cosmic Ring & Temporal Lens -->
  <circle cx="256" cy="256" r="100" fill="#090d18" stroke="url(#violetGrad)" stroke-width="10" filter="url(#glow)" />
  
  <!-- Optical Aperture Blades (3-Axis Focus) -->
  <g opacity="0.8">
    <path d="M 256 166 L 334 300" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
    <path d="M 334 300 L 178 300" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
    <path d="M 178 300 L 256 166" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Core Focal Point -->
  <circle cx="256" cy="256" r="54" fill="url(#coreGlow)" filter="url(#superGlow)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />

  <!-- GG Neon Micro Badge -->
  <g transform="translate(325, 345)">
    <rect x="0" y="0" width="88" height="42" rx="12" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" opacity="0.95" />
    <text x="44" y="29" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">GG</text>
  </g>
</svg>
