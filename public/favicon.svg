<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    GlimpseGG - monograma "G" como fita temporal.
    Um gesto contínuo, varrido no anti-horário (rewind), afunilando de 14 para 44
    unidades de espessura. Tres camadas apenas: fundo, fita, nucleo.

    A fita é gerada por amostragem densa (o comando A do SVG nao expressa raio
    variavel sem degraus nas junções). Nao editar o path a mao.
    Contrapartida in-app: src/components/brand/BrandMark.tsx - alterar um exige revisar o outro.
    Sem elementos de texto: a fonte resolvida pelo fontconfig varia por maquina.
  -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#131c30" />
      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>

    <!-- userSpaceOnUse: a fita e a barra precisam do MESMO mapeamento, senao a
         costura entre elas fica visivel (cada bbox mapearia o gradiente sozinho). -->
    <linearGradient id="ribbonGrad" gradientUnits="userSpaceOnUse" x1="118" y1="112" x2="424" y2="418">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="32%" stop-color="#a5f3fc" stop-opacity="0.85" />
      <stop offset="68%" stop-color="#22d3ee" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Fundo -->
  <rect x="32" y="32" width="448" height="448" rx="112"
        fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="4" />

  <!-- 2. A fita. A barra do G entra por dentro como stroke de cap redondo, cobrindo
       a tampa reta da fita - por isso a junção é invisivel. -->
  <g fill="url(#ribbonGrad)">
    <path d="M 368.61 161.51 L 364.83 157.02 L 360.87 152.69 L 356.74 148.51 L 352.44 144.49 L 347.99 140.65 L 343.38 136.99 L 338.62 133.51 L 333.73 130.22 L 328.7 127.13 L 323.55 124.24 L 318.29 121.55 L 312.92 119.07 L 307.45 116.81 L 301.89 114.77 L 296.25 112.95 L 290.54 111.35 L 284.76 109.98 L 278.93 108.85 L 273.06 107.94 L 267.15 107.27 L 261.21 106.84 L 255.26 106.64 L 249.29 106.69 L 243.34 106.97 L 237.39 107.48 L 231.46 108.24 L 225.57 109.23 L 219.71 110.46 L 213.91 111.92 L 208.16 113.61 L 202.48 115.53 L 196.88 117.68 L 191.36 120.05 L 185.94 122.64 L 180.63 125.45 L 175.42 128.47 L 170.34 131.69 L 165.38 135.12 L 160.57 138.75 L 155.9 142.57 L 151.38 146.57 L 147.02 150.76 L 142.83 155.12 L 138.81 159.64 L 134.98 164.33 L 131.33 169.17 L 127.88 174.15 L 124.62 179.27 L 121.57 184.52 L 118.73 189.89 L 116.11 195.38 L 113.7 200.97 L 111.52 206.65 L 109.56 212.42 L 107.84 218.27 L 106.34 224.19 L 105.09 230.17 L 104.07 236.19 L 103.3 242.26 L 102.76 248.35 L 102.47 254.47 L 102.43 260.6 L 102.62 266.73 L 103.07 272.85 L 103.76 278.95 L 104.69 285.02 L 105.86 291.06 L 107.27 297.05 L 108.93 302.98 L 110.82 308.84 L 112.94 314.63 L 115.3 320.33 L 117.88 325.94 L 120.68 331.45 L 123.71 336.84 L 126.95 342.11 L 130.4 347.25 L 134.06 352.26 L 137.91 357.11 L 141.96 361.82 L 146.19 366.36 L 150.61 370.73 L 155.2 374.92 L 159.96 378.93 L 164.87 382.75 L 169.94 386.37 L 175.15 389.79 L 180.5 393 L 185.98 396 L 191.57 398.78 L 197.28 401.34 L 203.09 403.66 L 208.99 405.76 L 214.97 407.62 L 221.02 409.24 L 227.14 410.62 L 233.32 411.75 L 239.54 412.64 L 245.79 413.28 L 252.07 413.67 L 258.36 413.8 L 264.66 413.69 L 270.95 413.33 L 277.23 412.71 L 283.48 411.85 L 289.7 410.73 L 295.87 409.37 L 301.98 407.76 L 308.03 405.9 L 314.01 403.81 L 319.9 401.48 L 325.7 398.91 L 331.4 396.11 L 336.98 393.08 L 342.44 389.83 L 347.77 386.37 L 352.96 382.69 L 358.01 378.8 L 362.89 374.72 L 367.62 370.44 L 372.17 365.97 L 376.55 361.32 L 380.73 356.49 L 384.73 351.5 L 388.52 3