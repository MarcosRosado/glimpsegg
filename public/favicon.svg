 L 224.55 129.86 L 229.58 128.6 L 234.67 127.54 L 239.8 126.69 L 244.96 126.04 L 250.14 125.6 L 255.35 125.36 L 260.56 125.33 L 265.78 125.51 L 270.99 125.9 L 276.18 126.49 L 281.35 127.29 L 286.49 128.3 L 291.59 129.52 L 296.64 130.94 L 301.63 132.56 L 306.56 134.37 L 311.41 136.39 L 316.19 138.6 L 320.87 141 L 325.47 143.59 L 329.95 146.36 L 334.33 149.31 L 338.59 152.44 L 342.72 155.73 L 346.73 159.19 L 350.59 162.81 L 354.31 166.59 L 357.88 170.51 A 7 7 0 0 1 368.61 161.51 Z" />
    <path d="M 396 256 L 318 256" fill="none" stroke="url(#ribbonGrad)"
          stroke-width="44" stroke-linecap="round" />
  </g>

  <!-- 3. Nucleo. Halo por gradiente transparente, nao por filtro: nenhum
       feGaussianBlur, para nao virar mancha nos tamanhos pequenos. -->
  <circle cx="256" cy="256" r="48" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="15" fill="#eefdff" />
</svg>
